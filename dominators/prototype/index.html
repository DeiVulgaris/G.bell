<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Доминаторы — 3D-сцена</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050b}
  canvas{display:block;width:100%;height:100%}
  #hint{position:fixed;left:14px;bottom:12px;color:#a9c7e8aa;font:12px system-ui,sans-serif;pointer-events:none}
</style>
</head>
<body>
<div id="hint">ЛКМ — вращение · колесо — приближение · ПКМ — сдвиг</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02050b);
const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 7, 27);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);
controls.minDistance = 5;
controls.maxDistance = 60;

// The scene is a bounded 3D volume. All world objects live inside this sphere.
const R = 18;
const boundary = new THREE.Mesh(
  new THREE.SphereGeometry(R, 64, 40),
  new THREE.MeshBasicMaterial({ color:0x438fd8, wireframe:true, transparent:true, opacity:0.22 })
);
scene.add(boundary);

// Inner spherical surface: a subtle latitude/longitude shell, facing inward.
const shell = new THREE.Mesh(
  new THREE.SphereGeometry(R - 0.06, 64, 40),
  new THREE.MeshBasicMaterial({ color:0x0a1c32, side:THREE.BackSide, transparent:true, opacity:0.12 })
);
scene.add(shell);
const grid = new THREE.Group();
const gridMat = new THREE.LineBasicMaterial({ color:0x367fc0, transparent:true, opacity:0.34 });
for (let lat=-75; lat<=75; lat+=15) {
  const a = THREE.MathUtils.degToRad(lat), pts=[];
  for(let j=0;j<=180;j++){ const t=j*Math.PI/90; pts.push(new THREE.Vector3((R-0.12)*Math.cos(a)*Math.cos(t),(R-0.12)*Math.sin(a),(R-0.12)*Math.cos(a)*Math.sin(t))); }
  grid.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),gridMat));
}
for(let lon=0;lon<180;lon+=15){
  const t=THREE.MathUtils.degToRad(lon),pts=[];
  for(let j=0;j<=180;j++){const a=-Math.PI/2+j*Math.PI/180;pts.push(new THREE.Vector3((R-0.12)*Math.cos(a)*Math.cos(t),(R-0.12)*Math.sin(a),(R-0.12)*Math.cos(a)*Math.sin(t)));}
  grid.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),gridMat));
  const t2=t+Math.PI, pts2=[];
  for(let j=0;j<=180;j++){const a=-Math.PI/2+j*Math.PI/180;pts2.push(new THREE.Vector3((R-0.12)*Math.cos(a)*Math.cos(t2),(R-0.12)*Math.sin(a),(R-0.12)*Math.cos(a)*Math.sin(t2)));}
  grid.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts2),gridMat));
}
scene.add(grid);

// Central planetarium projector: a physical 3D object at the sphere's origin.
const projector = new THREE.Group();
scene.add(projector);
const darkMetal = new THREE.MeshStandardMaterial({ color:0x182635, metalness:0.82, roughness:0.28 });
const brass = new THREE.MeshStandardMaterial({ color:0x9b7542, metalness:0.8, roughness:0.24 });
const lensMat = new THREE.MeshBasicMaterial({ color:0x9edcff });
function cylinder(radiusTop,radiusBottom,height,material,y,radial=48){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(radiusTop,radiusBottom,height,radial),material);
  m.position.y=y; projector.add(m); return m;
}
cylinder(1.35,1.55,0.42,darkMetal,-1.55);
cylinder(0.95,1.28,0.32,brass,-1.18);
cylinder(0.72,0.9,0.6,darkMetal,-0.72);
const core = new THREE.Mesh(new THREE.SphereGeometry(0.78,32,24),darkMetal);
core.position.y=0.15; projector.add(core);
const lens = new THREE.Mesh(new THREE.SphereGeometry(0.32,24,18),lensMat);
lens.position.set(0,0.15,0.72); projector.add(lens);
for(let i=0;i<8;i++){
  const a=i*Math.PI/4;
  const lamp=new THREE.Mesh(new THREE.SphereGeometry(0.09,12,8),new THREE.MeshBasicMaterial({color:0xffcf7b}));
  lamp.position.set(Math.cos(a)*0.66,0.18,Math.sin(a)*0.66); projector.add(lamp);
}
const ring = new THREE.Mesh(new THREE.TorusGeometry(1.02,0.055,12,64),brass);
ring.position.y=0.12; ring.rotation.x=Math.PI/2; projector.add(ring);

// Projection rays originate at the central projector and terminate on the inner sphere.
const rays = new THREE.Group();
const rayMat = new THREE.LineBasicMaterial({ color:0x73c9ff, transparent:true, opacity:0.25 });
for(let i=0;i<100;i++){
  const u=(i+0.5)/100, phi=Math.acos(1-2*u), theta=i*2.3999632297;
  const dir=new THREE.Vector3(Math.sin(phi)*Math.cos(theta),Math.cos(phi),Math.sin(phi)*Math.sin(theta));
  const end=dir.clone().multiplyScalar(R-0.2);
  rays.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),end]),rayMat));
}
scene.add(rays);

// A projected miniature planetary system, suspended inside the bounded volume.
const system = new THREE.Group();
scene.add(system);
const sun = new THREE.Mesh(new THREE.SphereGeometry(0.65,32,24),new THREE.MeshBasicMaterial({color:0xffd078}));
sun.position.set(0,3.8,0); system.add(sun);
const sunGlow = new THREE.PointLight(0xffc46b, 75, 24);
sunGlow.position.copy(sun.position); scene.add(sunGlow);
const planetSpecs=[
  {r:0.18,d:1.4,c:0xc4a27c,s:0.7},
  {r:0.28,d:2.25,c:0x69b9d8,s:1.8},
  {r:0.32,d:3.25,c:0x4f82d8,s:2.6},
  {r:0.52,d:4.6,c:0xd0b17d,s:3.7},
  {r:0.42,d:6.0,c:0x7a9bc7,s:4.8}
];
planetSpecs.forEach((p,i)=>{
  const orbit=new THREE.Mesh(new THREE.TorusGeometry(p.d,0.012,6,160),new THREE.MeshBasicMaterial({color:0x5c9bce,transparent:true,opacity:0.45}));
  orbit.rotation.x=Math.PI/2; orbit.position.y=3.8; system.add(orbit);
  const body=new THREE.Mesh(new THREE.SphereGeometry(p.r,24,16),new THREE.MeshStandardMaterial({color:p.c,roughness:0.75,metalness:0.08}));
  body.position.set(Math.cos(p.s)*p.d,3.8+Math.sin(p.s)*p.d*0.18,Math.sin(p.s)*p.d);
  system.add(body);
  if(i===4){
    const saturnRing=new THREE.Mesh(new THREE.TorusGeometry(0.68,0.055,8,48),new THREE.MeshStandardMaterial({color:0xb8a27f,metalness:0.4,roughness:0.65}));
    saturnRing.position.copy(body.position); saturnRing.rotation.x=1.25; saturnRing.rotation.y=0.25; system.add(saturnRing);
  }
});

// Stars are distributed only inside the sphere.
const starPositions=[];
for(let i=0;i<1800;i++){
  const v=new THREE.Vector3(Math.random()*2-1,Math.random()*2-1,Math.random()*2-1);
  if(v.lengthSq()>1){i--;continue;}
  v.normalize().multiplyScalar(Math.random()*(R-0.8));
  starPositions.push(v.x,v.y,v.z);
}
const starGeo=new THREE.BufferGeometry();
starGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPositions,3));
scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xb9d9ff,size:0.055,transparent:true,opacity:0.85})));

scene.add(new THREE.AmbientLight(0x6688aa,1.25));
const keyLight=new THREE.PointLight(0x7cbfff,40,25); keyLight.position.set(4,7,5); scene.add(keyLight);

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  projector.rotation.y += 0.0015;
  renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
