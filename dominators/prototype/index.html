<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Доминаторы — сцена 01</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020711}
#scene{display:block;width:100vw;height:100vh;background:#020711}
</style>
</head>
<body>
<canvas id="scene" aria-label="Космическая сцена Доминаторов"></canvas>
<script>
(()=>{
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
let w=0,h=0,dpr=1,yaw=0,pitch=0,stars=[];
const objects=[
 {name:'Звезда · Sol',type:'star',x:0,y:0,z:1500,r:52,color:'#fff0b0'},
 {name:'Меркурий',type:'planet',x:-260,y:30,z:1050,r:10,color:'#c4b8a5'},
 {name:'Венера',type:'planet',x:210,y:-35,z:1280,r:18,color:'#e8c58b'},
 {name:'Земля',type:'planet',x:-430,y:80,z:1750,r:20,color:'#5ea8ff'},
 {name:'Марс',type:'planet',x:560,y:40,z:1950,r:14,color:'#ff8767'},
 {name:'Орбитальная верфь',type:'station',x:-475,y:95,z:1760,r:7,color:'#65f4e8'},
 {name:'Торговая станция',type:'station',x:585,y:42,z:1940,r:7,color:'#ffc76b'},
 {name:'Астероид',type:'asteroid',x:160,y:170,z:850,r:6,color:'#aab7c7'},
 {name:'Астероид',type:'asteroid',x:-120,y:-100,z:700,r:4,color:'#aab7c7'},
 {name:'Астероид',type:'asteroid',x:330,y:-120,z:2400,r:5,color:'#aab7c7'}
];
function resize(){
 dpr=Math.min(window.devicePixelRatio||1,2);w=window.innerWidth;h=window.innerHeight;
 canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
 canvas.style.width=w+'px';canvas.style.height=h+'px';
 ctx.setTransform(dpr,0,0,dpr,0,0);
 stars=Array.from({length:Math.max(220,Math.round(w*h/5000))},()=>({
  x:Math.random()*w,y:Math.random()*h,a:.2+Math.random()*.7,r:.35+Math.random()*1.2
 }));
}
window.addEventListener('resize',resize);
function project(o){
 const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
 const xx=o.x*cy-o.z*sy,zz0=o.x*sy+o.z*cy;
 const yy=o.y*cp-zz0*sp,zz=o.y*sp+zz0*cp;
 const focal=Math.min(w,h)*.9,depth=zz+1000;
 if(depth<30)return null;
 return{x:w/2+xx*focal/depth,y:h/2-yy*focal/depth,r:Math.max(1,o.r*focal/depth),depth};
}
function drawWireSphere(r,color){
 ctx.save();ctx.strokeStyle=color;ctx.lineWidth=.8;ctx.globalAlpha=.58;
 for(let i=1;i<5;i++){
  const k=i/5;ctx.beginPath();ctx.ellipse(0,0,r*Math.sqrt(1-k*k),r*k,0,0,Math.PI*2);ctx.stroke();
 }
 for(let i=0;i<4;i++){
  const a=Math.PI/4*i;ctx.beginPath();ctx.ellipse(0,0,r,Math.max(1,r*Math.abs(Math.cos(a))),a,0,Math.PI*2);ctx.stroke();
 }
 ctx.restore();
}
function drawOrbits(){
 const m=Math.min(w,h);
 const orbits=[{a:.11,b:.07},{a:.17,b:.105},{a:.23,b:.145},{a:.30,b:.18}];
 ctx.save();ctx.translate(w/2,h/2);ctx.rotate(-.12-yaw*.12);
 ctx.strokeStyle='#4b8eb044';ctx.lineWidth=1;
 orbits.forEach(o=>{ctx.beginPath();ctx.ellipse(0,0,m*o.a,m*o.b,0,0,Math.PI*2);ctx.stroke()});
 ctx.restore();
}

function drawHUD(){
 // Minimal flight instruments: scene remains full-screen; no menus or controls.
 ctx.save();
 const cyan='#65e8ee', dim='#65e8ee88', amber='#ffc76b';
 // Radar
 const rx=w-105, ry=105, rr=Math.min(72,Math.max(48,w*.065));
 ctx.fillStyle='rgba(2,12,23,.72)';ctx.beginPath();ctx.arc(rx,ry,rr+9,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle=dim;ctx.lineWidth=1;
 ctx.beginPath();ctx.arc(rx,ry,rr,0,Math.PI*2);ctx.stroke();
 for(let i=1;i<=3;i++){ctx.beginPath();ctx.arc(rx,ry,rr*i/4,0,Math.PI*2);ctx.stroke()}
 ctx.beginPath();ctx.moveTo(rx-rr,ry);ctx.lineTo(rx+rr,ry);ctx.moveTo(rx,ry-rr);ctx.lineTo(rx,ry+rr);ctx.stroke();
 ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx+rr*.55,ry-rr*.72);ctx.strokeStyle=cyan;ctx.globalAlpha=.8;ctx.stroke();ctx.globalAlpha=1;
 const blips=[[-.36,-.25],[.22,-.4],[.48,.18],[-.18,.52],[.08,.12]];
 blips.forEach((p,i)=>{ctx.fillStyle=i===2?amber:cyan;ctx.beginPath();ctx.arc(rx+p[0]*rr,ry+p[1]*rr,i===2?3:2,0,Math.PI*2);ctx.fill()});
 ctx.font='10px monospace';ctx.fillStyle=cyan;ctx.textAlign='center';ctx.fillText('РАДАР',rx,ry-rr-15);
 // Speed / heading / shield
 const left=28, bottom=h-30;
 ctx.textAlign='left';ctx.fillStyle=dim;ctx.font='10px monospace';ctx.fillText('СКОРОСТЬ',left,bottom-68);
 ctx.fillStyle='#e7fbff';ctx.font='25px monospace';ctx.fillText('0.82 c',left,bottom-40);
 ctx.fillStyle=dim;ctx.font='10px monospace';ctx.fillText('КУРС  027°   ·   ДИСТАНЦИЯ  1.42 AU',left,bottom-15);
 const sw=Math.min(220,w*.28), sx=w/2-sw/2, sy=h-34;
 ctx.fillStyle=dim;ctx.font='10px monospace';ctx.fillText('ЩИТ',sx,sy-12);
 ctx.strokeStyle=dim;ctx.strokeRect(sx,sy,sw,7);
 const sg=ctx.createLinearGradient(sx,0,sx+sw,0);sg.addColorStop(0,'#ff6b6b');sg.addColorStop(.5,'#ffc76b');sg.addColorStop(1,cyan);
 ctx.fillStyle=sg;ctx.fillRect(sx,sy,sw*.76,7);
 ctx.fillStyle='#dffcff';ctx.textAlign='right';ctx.fillText('152%',sx+sw,sy-12);
 // Small corner reticle, no text panels or buttons.
 ctx.strokeStyle='#65e8ee66';ctx.lineWidth=1;
 const cx=w/2,cy=h/2, len=12, gap=7;
 ctx.beginPath();ctx.moveTo(cx-gap-len,cy);ctx.lineTo(cx-gap,cy);ctx.moveTo(cx+gap,cy);ctx.lineTo(cx+gap+len,cy);
 ctx.moveTo(cx,cy-gap-len);ctx.lineTo(cx,cy-gap);ctx.moveTo(cx,cy+gap);ctx.lineTo(cx,cy+gap+len);ctx.stroke();
 ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,w,h);ctx.fillStyle='#020711';ctx.fillRect(0,0,w,h);
 const grad=ctx.createRadialGradient(w*.5,h*.5,10,w*.5,h*.5,Math.max(w,h)*.7);
 grad.addColorStop(0,'#0b1b31');grad.addColorStop(1,'#020711');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
 for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#c9e5ff';ctx.fillRect(s.x,s.y,s.r,s.r)}
 ctx.globalAlpha=1;drawOrbits();
 ctx.strokeStyle='#397f9b25';ctx.lineWidth=1;
 ctx.beginPath();ctx.ellipse(w/2,h/2,Math.min(w,h)*.43,Math.min(w,h)*.27,-yaw*.3,0,Math.PI*2);ctx.stroke();
 const visible=objects.map(o=>({o,p:project(o)})).filter(q=>q.p).sort((a,b)=>b.p.depth-a.p.depth);
 for(const {o,p} of visible){
  ctx.save();ctx.translate(p.x,p.y);
  if(o.type==='star'){
   const g=ctx.createRadialGradient(0,0,0,0,0,p.r*2.8);
   g.addColorStop(0,'#fff8ce');g.addColorStop(.25,'#ffce70aa');g.addColorStop(1,'#ffb64a00');
   ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,p.r*2.8,0,Math.PI*2);ctx.fill();
  }
  ctx.strokeStyle=o.color;ctx.globalAlpha=.82;ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=.38;
  if(o.type==='planet'||o.type==='star')drawWireSphere(p.r,o.color);
  if(o.type==='station'){
   ctx.strokeRect(-p.r*1.5,-p.r*.7,p.r*3,p.r*1.4);
   ctx.beginPath();ctx.moveTo(-p.r*2,0);ctx.lineTo(p.r*2,0);ctx.moveTo(0,-p.r*1.6);ctx.lineTo(0,p.r*1.6);ctx.stroke();
  }
  if(o.type==='asteroid'){
   ctx.beginPath();ctx.moveTo(-p.r,-p.r*.4);ctx.lineTo(-p.r*.4,-p.r);ctx.lineTo(p.r*.8,-p.r*.7);ctx.lineTo(p.r,p.r*.5);ctx.lineTo(-p.r*.2,p.r);ctx.closePath();ctx.stroke();
  }
  ctx.globalAlpha=1;
  ctx.restore();
 }
 drawHUD();
 requestAnimationFrame(draw);
}
resize();draw();
})();
</script>
</body>
</html>
